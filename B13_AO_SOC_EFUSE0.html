<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFUSE 烧录统计工具</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #39ff14;
            --button-on: #39ff14;
            --button-off: #333;
            --border-color: #39ff14;
            --highlight: #39ff14;
            --panel-bg: #0d0d0d;
            --input-bg: #222;
        }
        
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: var(--highlight);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
            margin-bottom: 20px;
            font-size: 2.2em;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        .config-panel {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        
        .config-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .config-label {
            font-size: 0.9em;
            color: var(--text-color);
        }
        
        .config-input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 8px;
            font-family: inherit;
        }
        
        .config-button {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .config-button:hover {
            background-color: var(--highlight);
            color: var(--bg-color);
        }
        
        .editor-window {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }
        
        .bit-row {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
        }
        
        .bit-group {
            flex: 1;
            min-width: 0;
        }
        
        .bit-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin-bottom: 8px;
        }
        
        .bit-button {
            width: 18px;
            height: 18px;
            border: 1px solid var(--border-color);
            background-color: var(--button-off);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .bit-button.on {
            background-color: var(--button-on);
            box-shadow: 0 0 3px var(--button-on);
        }
        
        .hex-input {
            width: 100%;
            padding: 5px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: inherit;
            text-align: center;
        }
        
        .group-label {
            margin-bottom: 5px;
            font-size: 0.8em;
            color: var(--highlight);
        }
        
        .status-bar {
            margin-top: 20px;
            padding: 10px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            font-size: 0.9em;
            text-align: center;
        }
        
        .code-decoration {
            position: fixed;
            font-size: 0.7em;
            opacity: 0.3;
            z-index: -1;
            user-select: none;
        }
        
        .binary-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="binary-bg"></div>
    
    <div class="container">
        <h1 id="title">EFUSE 烧录统计工具</h1>
        
        <div class="config-panel">
            <div class="config-item">
                <span class="config-label">位数量:</span>
                <select id="bitCount" class="config-input">
                    <option value="1024">1024位</option>
                    <option value="2048" selected>2048位</option>
                    <option value="3072">3072位</option>
                    <option value="4096">4096位</option>
                </select>
            </div>
            
            <button id="applyConfig" class="config-button">应用配置</button>
            <button id="saveData" class="config-button">保存数据</button>
            <button id="clearData" class="config-button">清除数据</button>
            <button id="endianToggle" class="config-button">切换大小端</button>
        </div>
        
        <div class="editor-window" id="editorWindow">
            <!-- 位按钮和十六进制输入框将通过JavaScript动态生成 -->
        </div>
        
        <div class="status-bar" id="statusBar">
            就绪 | 数据自动保存 | 最后修改: 无 | 当前模式: 大端
        </div>
    </div>
    
    <div class="code-decoration" style="top: 50px; left: 30px;">01001000 01100101 01101100 01101100 01101111</div>
    <div class="code-decoration" style="bottom: 100px; right: 40px;">0xEF 0xAB 0xCD 0x12 0x34 0x56</div>
    <div class="code-decoration" style="top: 200px; right: 100px;">// EFUSE Programming Tool v2.4</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const editorWindow = document.getElementById('editorWindow');
            const statusBar = document.getElementById('statusBar');
            const title = document.getElementById('title');
            const bitCountSelect = document.getElementById('bitCount');
            const applyConfigBtn = document.getElementById('applyConfig');
            const saveDataBtn = document.getElementById('saveData');
            const clearDataBtn = document.getElementById('clearData');
            const endianToggleBtn = document.getElementById('endianToggle');
            
            const BITS_PER_GROUP = 32;
            const GROUPS_PER_ROW = 2;
            
            let efuseData = [];
            let currentBitCount = 2048;
            let lastModifiedTime = null;
            let currentFileName = getFileNameFromPath();
            let isLittleEndian = false; // 默认大端模式
            
            // 初始化
            function init() {
                loadConfig();
                updateTitle();
                initEditor();
                updateStatus('EFUSE 烧录工具已就绪');
                
                // 事件监听
                applyConfigBtn.addEventListener('click', applyConfig);
                saveDataBtn.addEventListener('click', saveData);
                clearDataBtn.addEventListener('click', clearData);
                endianToggleBtn.addEventListener('click', toggleEndian);
            }
            
            // 从路径获取文件名
            function getFileNameFromPath() {
                const path = window.location.pathname;
                const fileNameWithExt = path.split('/').pop();
                const fileName = fileNameWithExt.replace(/\.[^/.]+$/, "");
                return fileName || 'efuse_config';
            }
            
            // 更新标题
            function updateTitle() {
                title.textContent = `${currentFileName} 烧录统计工具`;
            }
            
            // 加载配置
            function loadConfig() {
                const savedConfig = localStorage.getItem('efuseConfig');
                if (savedConfig) {
                    try {
                        const config = JSON.parse(savedConfig);
                        currentBitCount = config.bitCount || 2048;
                        bitCountSelect.value = currentBitCount;
                        isLittleEndian = config.isLittleEndian || false;
                        
                        // 加载数据
                        const savedData = localStorage.getItem(`efuseData_${currentFileName}`);
                        if (savedData) {
                            const parsedData = JSON.parse(savedData);
                            if (parsedData.length === currentBitCount) {
                                efuseData = parsedData;
                                updateStatus(`从本地存储加载数据成功 (${currentFileName})`);
                                updateEndianStatus();
                                return;
                            }
                        }
                    } catch (e) {
                        console.error('加载配置失败:', e);
                        updateStatus('加载配置失败，使用默认值');
                    }
                }
                
                // 默认数据
                efuseData = new Array(currentBitCount).fill(0);
                updateStatus('使用默认初始化数据');
                updateEndianStatus();
            }
            
            // 更新大小端状态显示
            function updateEndianStatus() {
                const modeText = isLittleEndian ? '小端' : '大端';
                statusBar.textContent = statusBar.textContent.replace(/当前模式: [大小]端/, `当前模式: ${modeText}`);
            }
            
            // 应用配置
            function applyConfig() {
                const newBitCount = parseInt(bitCountSelect.value);
                if (newBitCount !== currentBitCount) {
                    currentBitCount = newBitCount;
                    
                    // 检查是否需要调整数据长度
                    if (efuseData.length !== currentBitCount) {
                        const newData = new Array(currentBitCount).fill(0);
                        const copyLength = Math.min(efuseData.length, currentBitCount);
                        for (let i = 0; i < copyLength; i++) {
                            newData[i] = efuseData[i];
                        }
                        efuseData = newData;
                    }
                    
                    initEditor();
                    updateStatus(`配置已更新: ${currentBitCount}位`);
                }
                
                // 保存配置
                saveConfig();
            }
            
            // 保存配置
            function saveConfig() {
                const config = {
                    bitCount: currentBitCount,
                    fileName: currentFileName,
                    isLittleEndian: isLittleEndian
                };
                localStorage.setItem('efuseConfig', JSON.stringify(config));
            }
            
            // 保存数据
            function saveData() {
                try {
                    localStorage.setItem(`efuseData_${currentFileName}`, JSON.stringify(efuseData));
                    lastModifiedTime = new Date();
                    updateStatus(`数据已保存 (${currentFileName}) ${lastModifiedTime.toLocaleTimeString()}`);
                    saveConfig();
                } catch (e) {
                    console.error('保存数据失败:', e);
                    updateStatus('保存数据失败');
                }
            }
            
            // 清除数据
            function clearData() {
                if (confirm('确定要清除所有数据吗？此操作不可撤销。')) {
                    efuseData = new Array(currentBitCount).fill(0);
                    initEditor();
                    updateStatus('数据已清除');
                    saveData();
                }
            }
            
            // 切换大小端模式
            function toggleEndian() {
                isLittleEndian = !isLittleEndian;
                updateStatus(`已切换为${isLittleEndian ? '小端' : '大端'}模式`);
                updateEndianStatus();
                refreshEditor();
                saveConfig();
            }
            
            // 更新状态栏
            function updateStatus(message) {
                const modeText = isLittleEndian ? '小端' : '大端';
                const baseStatus = `就绪 | 数据自动保存 | 最后修改: ${lastModifiedTime ? lastModifiedTime.toLocaleTimeString() : '无'} | 当前模式: ${modeText}`;
                
                statusBar.textContent = message;
                
                if (message.includes('成功') || message.includes('保存')) {
                    statusBar.style.color = 'var(--highlight)';
                } else if (message.includes('失败') || message.includes('错误')) {
                    statusBar.style.color = '#ff5555';
                } else {
                    statusBar.style.color = 'var(--text-color)';
                }
                
                setTimeout(() => {
                    statusBar.textContent = baseStatus;
                    statusBar.style.color = 'var(--text-color)';
                }, 3000);
            }
            
            // 初始化编辑器
            function initEditor() {
                editorWindow.innerHTML = '';
                
                const totalGroups = Math.ceil(currentBitCount / BITS_PER_GROUP);
                
                for (let row = 0; row < Math.ceil(totalGroups / GROUPS_PER_ROW); row++) {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'bit-row';
                    
                    for (let col = 0; col < GROUPS_PER_ROW; col++) {
                        const group = row * GROUPS_PER_ROW + col;
                        if (group >= totalGroups) break;
                        
                        const groupDiv = document.createElement('div');
                        groupDiv.className = 'bit-group';
                        
                        const label = document.createElement('div');
                        label.className = 'group-label';
                        label.textContent = `位 ${group * BITS_PER_GROUP} - ${Math.min((group + 1) * BITS_PER_GROUP, currentBitCount) - 1}`;
                        groupDiv.appendChild(label);
                        
                        const bitsDiv = document.createElement('div');
                        bitsDiv.className = 'bit-buttons';
                        
                        // 创建位按钮 - 从左到右依次为bit0到bit31
                        for (let i = 0; i < BITS_PER_GROUP; i++) {
                            const bitIndex = group * BITS_PER_GROUP + i;
                            if (bitIndex >= currentBitCount) break;
                            
                            const button = document.createElement('div');
                            button.className = `bit-button ${efuseData[bitIndex] ? 'on' : ''}`;
                            button.dataset.index = bitIndex;
                            button.title = `位 ${bitIndex}`;
                            
                            button.addEventListener('click', function() {
                                efuseData[bitIndex] = efuseData[bitIndex] ? 0 : 1;
                                this.classList.toggle('on');
                                updateHexInput(group);
                                markModified();
                            });
                            
                            bitsDiv.appendChild(button);
                        }
                        
                        groupDiv.appendChild(bitsDiv);
                        
                        // 创建十六进制输入框
                        const hexInput = document.createElement('input');
                        hexInput.className = 'hex-input';
                        hexInput.type = 'text';
                        hexInput.dataset.group = group;
                        hexInput.value = bitsToHex(group);
                        hexInput.placeholder = '输入十六进制(1-8位)';
                        
                        hexInput.addEventListener('input', function() {
                            const hexStr = this.value.trim().toUpperCase();
                            if (!/^[0-9A-F]{0,8}$/.test(hexStr)) {
                                this.value = bitsToHex(group);
                            }
                        });
                        
                        hexInput.addEventListener('change', function() {
                            let hexStr = this.value.trim().toUpperCase();
                            
                            // 自动高位补齐不足8位的部分
                            if (hexStr.length > 0 && hexStr.length < 8) {
                                hexStr = hexStr.padStart(8, '0').substring(0, 8);
                                this.value = hexStr;
                            }
                            
                            if (/^[0-9A-F]{8}$/.test(hexStr)) {
                                hexToBits(group, hexStr);
                            } else if (hexStr === '') {
                                // 清空时将所有位设为0
                                const startBit = group * BITS_PER_GROUP;
                                const endBit = Math.min(startBit + BITS_PER_GROUP, currentBitCount);
                                for (let i = startBit; i < endBit; i++) {
                                    efuseData[i] = 0;
                                }
                                updateBitButtons(group);
                                markModified();
                            } else {
                                this.value = bitsToHex(group);
                            }
                        });
                        
                        hexInput.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter') {
                                this.blur();
                            }
                        });
                        
                        groupDiv.appendChild(hexInput);
                        rowDiv.appendChild(groupDiv);
                    }
                    
                    editorWindow.appendChild(rowDiv);
                }
            }
            
            // 刷新编辑器
            function refreshEditor() {
                const totalGroups = Math.ceil(currentBitCount / BITS_PER_GROUP);
                for (let group = 0; group < totalGroups; group++) {
                    updateHexInput(group);
                }
            }
            
            // 标记数据已修改
            function markModified() {
                lastModifiedTime = new Date();
                updateStatus('数据已修改');
                saveData();
            }
            
            // 将位转换为十六进制字符串
            function bitsToHex(group) {
                let hexStr = '';
                const startBit = group * BITS_PER_GROUP;
                const endBit = Math.min(startBit + BITS_PER_GROUP, currentBitCount);
                
                if (isLittleEndian) {
                    // 小端模式处理 - 字节顺序反转
                    for (let byteIndex = 3; byteIndex >= 0; byteIndex--) {
                        let byte = 0;
                        const byteStart = startBit + byteIndex * 8;
                        
                        if (byteStart >= endBit) continue;
                        
                        for (let bitPos = 0; bitPos < 8; bitPos++) {
                            const bitIndex = byteStart + bitPos;
                            if (bitIndex < endBit) {
                                byte |= efuseData[bitIndex] << bitPos;
                            }
                        }
                        
                        hexStr += byte.toString(16).padStart(2, '0').toUpperCase();
                    }
                } else {
                    // 大端模式处理 - 正常顺序
                    for (let byteIndex = 0; byteIndex < 4; byteIndex++) {
                        let byte = 0;
                        const byteStart = startBit + byteIndex * 8;
                        
                        if (byteStart >= endBit) break;
                        
                        for (let bitPos = 0; bitPos < 8; bitPos++) {
                            const bitIndex = byteStart + bitPos;
                            if (bitIndex < endBit) {
                                byte |= efuseData[bitIndex] << (7 - bitPos);
                            }
                        }
                        
                        hexStr += byte.toString(16).padStart(2, '0').toUpperCase();
                    }
                }
                
                return hexStr;
            }
            
            // 将十六进制字符串转换为位
            function hexToBits(group, hexStr) {
                const startBit = group * BITS_PER_GROUP;
                
                // 确保hexStr是8位十六进制
                hexStr = hexStr.padStart(8, '0').substring(0, 8);
                
                if (isLittleEndian) {
                    // 小端模式处理 - 字节顺序反转
                    for (let byteIndex = 3; byteIndex >= 0; byteIndex--) {
                        const byteStr = hexStr.substring((3 - byteIndex) * 2, (3 - byteIndex) * 2 + 2);
                        const byte = parseInt(byteStr, 16) || 0;
                        
                        for (let bitPos = 0; bitPos < 8; bitPos++) {
                            const bitIndex = startBit + byteIndex * 8 + bitPos;
                            if (bitIndex < currentBitCount) {
                                efuseData[bitIndex] = (byte >> bitPos) & 1;
                            }
                        }
                    }
                } else {
                    // 大端模式处理 - 正常顺序
                    for (let byteIndex = 0; byteIndex < 4; byteIndex++) {
                        const byteStr = hexStr.substring(byteIndex * 2, byteIndex * 2 + 2);
                        const byte = parseInt(byteStr, 16) || 0;
                        
                        for (let bitPos = 0; bitPos < 8; bitPos++) {
                            const bitIndex = startBit + byteIndex * 8 + bitPos;
                            if (bitIndex < currentBitCount) {
                                efuseData[bitIndex] = (byte >> (7 - bitPos)) & 1;
                            }
                        }
                    }
                }
                
                updateBitButtons(group);
                markModified();
            }
            
            // 更新位按钮状态
            function updateBitButtons(group) {
                const startBit = group * BITS_PER_GROUP;
                const endBit = Math.min(startBit + BITS_PER_GROUP, currentBitCount);
                
                for (let i = startBit; i < endBit; i++) {
                    const button = editorWindow.querySelector(`.bit-button[data-index="${i}"]`);
                    if (button) {
                        button.className = `bit-button ${efuseData[i] ? 'on' : ''}`;
                    }
                }
            }
            
            // 更新十六进制输入框
            function updateHexInput(group) {
                const hexInput = editorWindow.querySelector(`.hex-input[data-group="${group}"]`);
                if (hexInput) {
                    hexInput.value = bitsToHex(group);
                }
            }
            
            // 初始化应用
            init();
        });
    </script>
</body>
</html>
