<!DOCTYPE html>
<html>
<head>
    <title>Hex-ASCII转换工具</title>
    <style>
        :root {
            --terminal-green: #00ff00;
            --background-dark: #0d1a0d;
            --panel-bg: #001a00;
        }
        
        body {
            background: var(--background-dark);
            color: var(--terminal-green);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 20px;
            min-width: 600px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid var(--terminal-green);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .title {
            font-size: 2.5em;
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, #00ff00 0%, #009900 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .conversion-type {
            text-align: center;
            margin: 10px;
            font-size: 1.2em;
            color: #00cc00;
        }

        .editor-box {
            margin: 20px;
            position: relative;
        }

        .editor-label {
            display: block;
            margin-bottom: 8px;
            color: #00cc00;
            font-size: 0.9em;
        }

        .editor {
            width: 100%;
            height: 150px;
            background: var(--panel-bg);
            border: 2px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 15px;
            box-sizing: border-box;
            font-family: 'Consolas', monospace;
            resize: vertical;
            caret-color: var(--terminal-green);
        }

        .editor::placeholder {
            color: #009900;
            font-style: italic;
        }

        .result-box {
            margin: 20px;
        }

        .result {
            width: 100%;
            height: 150px;
            background: var(--panel-bg);
            border: 2px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 15px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-sizing: border-box;
        }

        .button-group {
            text-align: center;
            margin: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            background: #002200;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 3px;
        }

        button:hover {
            background: #004400;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
        }

        #contextMenu {
            position: absolute;
            background: #001100;
            border: 1px solid var(--terminal-green);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            display: none;
            z-index: 1000;
        }

        .menu-item {
            padding: 8px 20px;
            color: var(--terminal-green);
            cursor: pointer;
            white-space: nowrap;
        }

        .menu-item:hover {
            background: #003300;
        }

        .divider {
            border-bottom: 1px solid #004400;
            margin: 3px 0;
        }

        .status-bar {
            text-align: center;
            color: #009900;
            margin: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">HEX/ASCII 转换工具</h1>
        
        <div class="conversion-type" id="conversionStatus">
            🠖 当前模式：十六进制转ASCII 🠔
        </div>

        <div class="button-group">
            <button onclick="setConversionType('hex2ascii')">HEX → ASCII</button>
            <button onclick="setConversionType('ascii2hex')">ASCII → HEX</button>
        </div>

        <div class="editor-box">
            <label class="editor-label">输入窗口 (右键可调出格式菜单)</label>
            <textarea class="editor" id="input" 
                      placeholder="在此输入十六进制数据（示例：48656c6c6f）"
                      oncontextmenu="showContextMenu(event)"
                      spellcheck="false"></textarea>
        </div>

        <div class="result-box">
            <label class="editor-label">输出结果</label>
            <div class="result" id="output"></div>
        </div>

        <div class="status-bar" id="statusBar">就绪</div>

        <div id="contextMenu">
            <div class="menu-item" onclick="formatInput('continuous')">连续显示</div>
            <div class="divider"></div>
            <div class="menu-item" onclick="formatInput('byte')">按Byte显示</div>
            <div class="menu-item" onclick="formatInput('word')">按Word显示</div>
            <div class="divider"></div>
            <div class="menu-item" onclick="formatInput('array')">数组方式显示</div>
            <div class="divider"></div>
            <div class="menu-item" onclick="formatInput('endian')">大小端转换</div>
        </div>
    </div>

    <script>
        let conversionType = 'hex2ascii';
        let lastValidInput = '';

        function setConversionType(type) {
            conversionType = type;
            const input = document.getElementById('input');
            
            // 更新输入提示和状态
            if(type === 'hex2ascii') {
                document.getElementById('conversionStatus').innerHTML = '🠖 当前模式：十六进制转ASCII 🠔';
                input.placeholder = "在此输入十六进制数据（示例：48656c6c6f → Hello）";
            } else {
                document.getElementById('conversionStatus').innerHTML = '🠖 当前模式：ASCII转十六进制 🠔';
                input.placeholder = "在此输入文本内容（示例：Hello → 48656c6c6f）";
            }
            updateStatus('模式已切换');
            convert();
        }

        function convert() {
            const input = document.getElementById('input').value;
            let output = '';
            
            try {
                if(conversionType === 'hex2ascii') {
                    output = hexToAscii(input);
                    lastValidInput = input;
                } else {
                    output = asciiToHex(input);
                    lastValidInput = input;
                }
                document.getElementById('output').textContent = output;
                updateStatus('转换成功');
            } catch(e) {
                document.getElementById('output').textContent = `错误：${e.message}`;
                document.getElementById('input').value = lastValidInput;
                updateStatus('转换错误', true);
            }
        }

        function hexToAscii(hex) {
            // 预处理输入
            let cleaned = hex
                .replace(/0x[\da-fA-F]+:\s*/g, '')  // 移除地址
                .replace(/[\n\r]/g, '')             // 移除换行
                .replace(/[^0-9a-fA-F]/g, '')       // 移除非十六进制字符
                .toLowerCase();
            
            if(cleaned.length % 2 !== 0) throw new Error("十六进制长度应为偶数");
            
            let str = '';
            for(let i=0; i<cleaned.length; i+=2) {
                const byte = cleaned.substr(i, 2);
                if(!/^[0-9a-f]{2}$/.test(byte)) throw new Error("无效的十六进制字符");
                str += String.fromCharCode(parseInt(byte, 16));
            }
            return str;
        }

        function asciiToHex(text) {
            let hex = '';
            for(let i=0; i<text.length; i++) {
                const code = text.charCodeAt(i);
                if(code > 255) throw new Error("仅支持ASCII字符（0-255）");
                hex += code.toString(16).padStart(2, '0') + ' ';
            }
            return hex.trim().toUpperCase();
        }

        // 右键菜单功能
        function showContextMenu(e) {
            e.preventDefault();
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.left = `${e.pageX}px`;
            menu.style.top = `${e.pageY}px`;
            
            document.addEventListener('click', () => {
                menu.style.display = 'none';
            }, {once: true});
        }

        function formatInput(type) {
            const input = document.getElementById('input');
            let value = input.value
                .replace(/0x[\da-fA-F]+:\s*/g, '')
                .replace(/[^0-9a-fA-F]/g, '');
            
            try {
                switch(type) {
                    case 'continuous':
                        input.value = value;
                        break;
                    case 'byte':
                        input.value = value.match(/.{1,2}/g).join(' ');
                        break;
                    case 'word':
                        input.value = value.match(/.{1,4}/g).join(' ');
                        break;
                    case 'array':
                        input.value = '0x' + value.match(/.{2}/g).join(', 0x');
                        break;
                    case 'endian':
                        if(value.length%4 !== 0) throw new Error("需要4的倍数长度");
                        input.value = value.match(/.{4}/g)
                            .map(w => w.slice(2)+w.slice(0,2)).join('');
                        break;
                }
                updateStatus(`已应用格式：${getFormatName(type)}`);
                convert();
            } catch(e) {
                updateStatus(e.message, true);
            }
        }

        function getFormatName(type) {
            const names = {
                continuous: '连续显示',
                byte: '按字节显示',
                word: '按字显示',
                array: '数组格式',
                endian: '大小端转换'
            };
            return names[type] || '未知格式';
        }

        function updateStatus(message, isError = false) {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = message;
            statusBar.style.color = isError ? '#ff5555' : '#00cc00';
            setTimeout(() => statusBar.style.color = '#00cc00', 2000);
        }

        // 输入监听
        document.getElementById('input').addEventListener('input', () => {
            try {
                convert();
                document.getElementById('input').style.borderColor = '#00ff00';
            } catch {
                document.getElementById('input').style.borderColor = '#ff0000';
            }
        });

        // 初始化
        setConversionType('hex2ascii');
    </script>
</body>
</html>
